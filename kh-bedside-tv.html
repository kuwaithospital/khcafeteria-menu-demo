<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#212A5F;--navy2:#2E3A80;--deep:#10153A;--gold:#2F86C8;--gold2:#8CC8F0;--ivory:#FAFCFE;--sand:#EDF4FA;--text:#12163A;--muted:#5B6082;--ok:#12A37F;--warn:#E39B2D;
  --serif:'Cormorant Garamond',Georgia,serif;--en:'Fira Sans',system-ui,sans-serif;--ar:'Tajawal','Fira Sans',sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05071a;overflow:hidden;font-family:var(--en);-webkit-font-smoothing:antialiased}
.ar{font-family:var(--ar);direction:rtl}
button{font-family:inherit;border:0;cursor:pointer}
/* the TV: a fixed 1920 x 1080 stage scaled to fit any screen */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:#fff;
  background:radial-gradient(1200px 700px at 80% -10%,rgba(46,58,128,.9),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(47,134,200,.18),transparent 60%),linear-gradient(160deg,#161C44,#0D1233)}
.top{position:absolute;left:0;right:0;top:0;height:120px;display:flex;align-items:center;gap:28px;padding:0 60px;border-bottom:1px solid rgba(140,200,240,.18)}
.logo{width:64px;height:64px;border-radius:18px;background:#fff;color:var(--navy);display:grid;place-items:center}
.brand b{display:block;font-size:24px;letter-spacing:.14em}.brand span{font-size:18px;color:#B8BEE3}
.who{margin-left:40px}.who .g{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--gold2)}.who b{display:block;font-family:var(--serif);font-size:38px;font-weight:600;line-height:1}
.room{margin-left:auto;display:flex;gap:14px}
.pill{padding:12px 22px;border-radius:999px;border:1px solid rgba(140,200,240,.35);background:rgba(255,255,255,.06);font-size:20px;color:#E8F2FA;white-space:nowrap}
.pill.ok{border-color:rgba(95,224,189,.4);color:#A6EAD5}
.clock{text-align:right;margin-left:24px}.clock b{display:block;font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}.clock span{font-size:17px;color:#9AA0C6}
.rail{position:absolute;left:60px;top:160px;width:300px;display:grid;gap:10px}
.rail h6{margin:0 0 6px;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);font-weight:600}
.ri{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.04);border:2px solid transparent;color:#B8BEE3;font-size:22px;font-weight:600;text-align:left;transition:all .25s var(--ease)}
.ri .n{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(140,200,240,.45);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-style:italic;color:var(--gold2);flex:none}
.ri.done{color:#fff}.ri.done .n{background:var(--gold);border-color:var(--gold);color:#0F1E45;font-style:normal;font-family:var(--en);font-size:20px}
.ri.cur{background:rgba(140,200,240,.14);color:#fff;border-color:rgba(140,200,240,.4)}
.ri small{display:block;font-size:15px;font-weight:400;color:#9AA0C6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.main{position:absolute;left:400px;top:150px;width:1010px;height:820px}
.eyebrow{font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2);font-weight:600}
.main h1{font-family:var(--serif);font-size:72px;font-weight:600;margin:6px 0 0;line-height:1}
.main h1 .ar{font-size:34px;color:#C9CEEA;margin-left:18px;font-weight:500}
.sub{font-size:22px;color:#B8BEE3;margin-top:8px}
.cards{display:flex;gap:30px;margin-top:34px}
.card{position:relative;width:316px;background:var(--ivory);color:var(--text);border-radius:30px;overflow:hidden;text-align:left;padding:0;border:4px solid transparent;transition:transform .3s var(--ease),box-shadow .3s,border-color .2s;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card .ph{position:relative;height:300px;background:linear-gradient(135deg,#EDF4FA,#DCD8F2);display:grid;place-items:center;font-size:110px;overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .tag{position:absolute;left:18px;top:18px;z-index:2;background:rgba(255,253,249,.93);color:#1F5F98;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;border-radius:999px}
.card .rib{position:absolute;left:18px;bottom:18px;z-index:2;background:linear-gradient(110deg,#2B7BBF,#8CC8F0);color:#0F1E45;font-size:16px;font-weight:700;padding:9px 16px;border-radius:999px}
.card .tick{position:absolute;right:18px;top:18px;z-index:2;width:56px;height:56px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:30px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.card.sel .tick{transform:scale(1)}
.card .tx{padding:22px 26px 26px}
.card b{display:block;font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.05}
.card .car{display:block;font-size:24px;color:var(--muted);margin:4px 0 10px;text-align:left}
.card p{margin:0 0 14px;font-size:18px;line-height:1.5;color:#6B6F8A;min-height:54px}
.card .meta{font-size:17px;color:#5B7FA3;border-top:1px solid #DCE7F1;padding-top:12px}
.card.sel{border-color:var(--gold)}
.card.locked{opacity:.45}
.focus{outline:none}
.nav:focus{outline:none}
.card:focus{transform:translateY(-14px) scale(1.04);border-color:var(--gold2);box-shadow:0 0 0 6px rgba(140,200,240,.5),0 40px 80px rgba(0,0,0,.55)}
.ri:focus,.tile:focus,.big:focus,.star:focus,.trayb:focus{box-shadow:0 0 0 5px rgba(140,200,240,.75),0 18px 40px rgba(0,0,0,.4);transform:scale(1.04)}
.tray{position:absolute;right:60px;top:160px;width:400px;bottom:130px;display:flex;flex-direction:column;background:var(--ivory);color:var(--text);border-radius:30px;padding:28px;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.tray:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:30px 30px 0 0;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
.tray .ey{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
.tray h3{font-family:var(--serif);font-size:40px;font-weight:600;margin:2px 0 8px}
.tl{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed #DCE7F1;font-size:19px}
.tl .th{position:relative;width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--sand);display:grid;place-items:center;font-size:28px;flex:none}
.tl .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl small{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tl.empty{color:#93A9C0}.tl.empty .th{background:#fff;border:2px dashed #DCE7F1}
.tsum{display:flex;justify-content:space-between;margin-top:16px;font-size:19px;color:var(--muted)}.tsum b{color:var(--navy);font-size:24px}
.twhen{margin-top:12px;padding:12px 16px;border-radius:16px;background:var(--sand);font-size:16.5px;line-height:1.35;color:#1F5F98;font-weight:600}
.trayb{margin-top:auto;padding:20px;border-radius:20px;font-size:24px;font-weight:700;background:#C5D3E0;color:#fff;transition:all .25s}
.trayb.ready{background:linear-gradient(120deg,#2B7BBF,#4FA8E0);color:#0F1E45;box-shadow:0 14px 30px rgba(43,123,191,.45)}
.hints{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;gap:40px;padding:0 60px;background:rgba(5,7,26,.55);border-top:1px solid rgba(140,200,240,.15);font-size:20px;color:#C9CEEA}
.k{display:inline-grid;place-items:center;min-width:46px;height:46px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-weight:700;color:#fff;margin-right:10px;font-size:18px}
.k.ok{border-radius:50%;background:var(--gold);color:#0F1E45;border:0}
.hints .cut{margin-left:auto;color:var(--gold2);font-weight:600}
/* tiles for time / review */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}
.tile{padding:26px 18px;border-radius:24px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);color:#fff;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;transition:all .25s var(--ease)}
.tile small{display:block;font-size:17px;font-weight:400;color:#B8BEE3;margin-top:6px}
.tile.wide{grid-column:span 2;text-align:left;display:flex;align-items:center;gap:20px;font-size:30px}
.tile.wide span{font-size:48px}
.tile.on{background:linear-gradient(120deg,#2B7BBF,#4FA8E0);border-color:transparent;color:#0F1E45}.tile.on small{color:#3D311A}
.lbl{margin-top:34px;font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);font-weight:600}
.rev{display:flex;gap:18px;margin-top:30px}
.rv{flex:1;background:var(--ivory);color:var(--text);border-radius:22px;overflow:hidden}
.rv .ph{position:relative;height:150px;background:linear-gradient(135deg,#EDF4FA,#DCD8F2);display:grid;place-items:center;font-size:64px}
.rv .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rv div:last-child{padding:12px 14px}.rv small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.rv b{font-family:var(--serif);font-size:24px}
.facts{display:flex;gap:16px;margin-top:24px}
.fact{flex:1;padding:18px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.fact b{display:block;font-size:34px}.fact span{font-size:16px;color:#B8BEE3;letter-spacing:.06em}
.bigs{display:flex;gap:20px;margin-top:34px}
.big{padding:26px 40px;border-radius:22px;font-size:28px;font-weight:700;transition:all .25s}
.big.gold{background:linear-gradient(120deg,#2B7BBF,#4FA8E0);color:#0F1E45}
.big.soft{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.2)}
/* done / tracker / rate */
.center{position:absolute;left:400px;right:520px;top:170px;text-align:center}
.chk{width:170px;height:170px;margin:0 auto}
.chk circle{fill:none;stroke:var(--gold2);stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .8s var(--ease) forwards}
.chk path{fill:none;stroke:var(--gold2);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .6s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.center h1{font-family:var(--serif);font-size:84px;font-weight:600;margin:10px 0 0}
.center .ar{font-size:34px;color:#C9CEEA}
.ord{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:999px;background:rgba(255,255,255,.1);font-size:22px;letter-spacing:.14em;font-weight:700}
.trk{display:flex;margin:56px 20px 0}
.st{flex:1;position:relative;font-size:22px;color:#7D83B3;font-weight:600}
.st:before{content:"";position:absolute;top:26px;left:-50%;right:50%;height:5px;background:rgba(255,255,255,.12)}
.st:first-child:before{display:none}
.st .dt{position:relative;z-index:1;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;border:4px solid rgba(255,255,255,.2);background:#161C44;display:grid;place-items:center;font-size:26px;transition:all .5s}
.st.done{color:#fff}.st.done:before{background:var(--ok)}.st.done .dt{background:var(--ok);border-color:var(--ok)}
.st.now{color:#fff}.st.now .dt{border-color:var(--gold2);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(140,200,240,.55)}100%{box-shadow:0 0 0 22px rgba(140,200,240,0)}}
.msg{margin-top:40px;font-family:var(--serif);font-size:44px;font-style:italic;color:var(--gold2)}
.stars{display:flex;justify-content:center;gap:22px;margin-top:40px}
.star{font-size:120px;line-height:1;background:none;color:rgba(255,255,255,.18);border-radius:24px;padding:0 10px;transition:all .2s}
.star.on{color:#4FA8E0;text-shadow:0 10px 40px rgba(245,196,81,.5)}
.slbl{margin-top:18px;font-family:var(--serif);font-size:44px;font-style:italic;color:var(--gold2);min-height:56px}
.fade{animation:fadeIn .45s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}}
.toast{position:absolute;left:50%;top:140px;transform:translateX(-50%);background:var(--gold);color:#0F1E45;padding:18px 34px;border-radius:999px;font-size:24px;font-weight:700;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:fadeIn .4s var(--ease)}
.demo{position:fixed;right:12px;bottom:12px;z-index:9;background:rgba(255,255,255,.1);color:#C9CEEA;font:13px var(--en);padding:8px 12px;border-radius:10px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="demo">Demo: use the arrow keys and Enter (or click) like a TV remote · Backspace = back</div>
<script>
const HI = id => `https://images.unsplash.com/photo-${id}?w=1600&q=90&auto=format&fit=crop`;
const MENU = [
  {cat:'Protein', ar:'البروتين', items:[
    {n:'Grilled Chicken', d:'Herb-marinated chicken breast, chargrilled and finished with lemon and thyme.', da:'صدر دجاج متبّل بالأعشاب، مشوي مع الليمون والزعتر', ar:'دجاج مشوي', e:'🍗', img:HI('1532550907401-a500c9a57435'), alt:'https://images.pexels.com/photos/2418486/pexels-photo-2418486.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'High protein', v:[190,0,34,6,190,310,240]},
    {n:'Baked Fish', d:'Oven-baked white fish fillet with olive oil, garlic and fresh parsley.', da:'فيليه سمك أبيض مخبوز بزيت الزيتون والثوم والبقدونس', ar:'سمك مخبوز', e:'🐟', img:HI('1519708227418-c8fd9a32b7a2'), alt:'https://images.pexels.com/photos/5713767/pexels-photo-5713767.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Omega-3', v:[165,0,30,5,175,360,255]},
    {n:'Beef Stew', d:'Tender beef, slowly braised with carrots and root vegetables.', da:'لحم بقري مطهو ببطء مع الجزر والخضار الجذرية', ar:'يخنة لحم', e:'🥩', img:HI('1546833999-b9f581a1996d'), alt:'https://images.pexels.com/photos/3981486/pexels-photo-3981486.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Hearty', v:[245,5,29,12,320,410,260]} ]},
  {cat:'Carbohydrate', ar:'النشويات', items:[
    {n:'Brown Rice', d:'Steamed whole-grain brown rice, lightly seasoned.', da:'أرز بني كامل الحبة مطهو على البخار', ar:'أرز بني', e:'🍚', img:HI('1512058564366-18510be2db19'), alt:'https://images.unsplash.com/photo-1603488742308-3bc8bde72f57?w=1200&q=85&auto=format&fit=crop', tag:'Low GI', v:[165,35,4,1,8,80,85]},
    {n:'Mashed Potato', d:'Silky potato purée with a touch of warm milk.', da:'بطاطس مهروسة ناعمة بلمسة من الحليب الدافئ', ar:'بطاطس مهروسة', e:'🥔', img:HI('1518977676601-b53f82aba655'), alt:'https://images.unsplash.com/photo-1707616954324-99c89a78a20d?w=1200&q=85&auto=format&fit=crop', tag:'Soft', v:[145,28,3,3,130,410,65]},
    {n:'Whole Wheat Bread', d:'Freshly baked whole wheat bread, sliced to order.', da:'خبز قمح كامل طازج من مخبزنا', ar:'خبز قمح كامل', e:'🍞', img:HI('1509440159596-0249088772ff'), alt:'https://images.unsplash.com/photo-1715189997923-dd8bf6e9bd91?w=1200&q=85&auto=format&fit=crop', tag:'High fibre', v:[115,21,5,2,180,95,95]} ]},
  {cat:'Salad', ar:'السلطة', items:[
    {n:'Garden Salad', d:'Crisp lettuce, cucumber, tomato and carrot with a lemon dressing.', da:'خس مقرمش وخيار وطماطم وجزر مع صلصة الليمون', ar:'سلطة خضراء', e:'🥗', img:HI('1512621776951-a57141f2eefd'), alt:'https://images.pexels.com/photos/406152/pexels-photo-406152.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Fresh', v:[55,9,2,2,90,230,35]},
    {n:'Cucumber Salad', d:'Fresh sliced cucumber with mint and a squeeze of lemon.', da:'خيار طازج مع النعناع وعصير الليمون', ar:'سلطة خيار', e:'🥒', img:HI('1540420773420-3366772f4999'), alt:'https://images.pexels.com/photos/10432461/pexels-photo-10432461.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Light', v:[40,6,2,1,75,170,30]} ]},
  {cat:'Soup', ar:'الشوربة', items:[
    {n:'Vegetable Soup', d:'Clear broth with seasonal vegetables, gently simmered.', da:'مرق صافٍ مع خضار الموسم', ar:'شوربة خضار', e:'🍲', img:HI('1547592180-85f173990554'), alt:'https://images.pexels.com/photos/15108369/pexels-photo-15108369.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Warm', v:[85,13,3,2,210,280,55]},
    {n:'Lentil Soup', d:'Traditional red lentil soup with cumin and lemon.', da:'شوربة عدس أحمر تقليدية بالكمون والليمون', ar:'شوربة عدس', e:'🥣', img:HI('1547592166-23ac45744acd'), alt:'https://images.pexels.com/photos/6120506/pexels-photo-6120506.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Plant protein', v:[140,20,8,3,240,310,130]} ]},
  {cat:'Snack', ar:'وجبة خفيفة', items:[
    {n:'Plain Yogurt', d:'Creamy natural yogurt, unsweetened.', da:'زبادي طبيعي كريمي غير محلّى', ar:'زبادي', e:'🥛', img:HI('1488477181946-6428a0291777'), alt:'https://images.pexels.com/photos/13466256/pexels-photo-13466256.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Probiotic', v:[95,9,7,4,80,260,190]},
    {n:'Small Apple', d:'A crisp, fresh seasonal apple.', da:'تفاحة طازجة ومقرمشة من فاكهة الموسم', ar:'تفاحة صغيرة', e:'🍎', img:HI('1560806887-1e4cd0b6cbd6'), alt:'https://images.pexels.com/photos/89434/pexels-photo-89434.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Natural', v:[80,21,0,0,1,160,15]},
    {n:'Sugar-Free Jelly', d:'Light fruit-flavoured jelly with no added sugar.', da:'جيلي خفيف بنكهة الفواكه بدون سكر مضاف', ar:'جيلي بدون سكر', e:'🍮', img:HI('1499636136210-6f4ee915583e'), alt:'https://images.pexels.com/photos/965242/pexels-photo-965242.jpeg?auto=compress&cs=tinysrgb&w=1200', tag:'Sugar-free', v:[10,2,1,0,35,15,5]} ]}
];
const NUT = [ // label, unit, illustrative per-meal guide (protein is a minimum target)
  ['Calories','kcal',650],['Carbohydrates','g',60],['Protein','g',30],['Fat','g',20],
  ['Sodium','mg',800],['Potassium','mg',1200],['Phosphorus','mg',500]];

const MIN = 60000, ROMAN = ['I','II','III','IV','V'];
const STEPS = MENU.length;           // 0..4 courses, 5 = time, 6 = review, 7 = done, 8 = rate, 9 = thanks
// demo dietitian plan for Room 312 (diabetic): carbs limited, one dish recommended per course
const PLAN = {allowed:{Protein:[0,1,2],Carbohydrate:[2],Salad:[0,1],Soup:[0,1],Snack:[0,2]}, rec:{Protein:0,Carbohydrate:2,Salad:1,Soup:0,Snack:2}};
let step = 0, sel = {}, when = {type:'asap'}, stars = 0, track = 0, focusKey = null;
const $ = id => document.getElementById(id);
const fmt = t => new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const ok = (cat,i) => PLAN.allowed[cat].includes(i);
function imgFail(el){ if(el.dataset.alt && !el.dataset.tried){ el.dataset.tried = 1; el.src = el.dataset.alt; } else el.remove(); }
const pic = f => `${f.e}<img src="${f.img}" data-alt="${f.alt||''}" alt="" onerror="imgFail(this)">`;
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080), st = $('stage'); st.style.transform = `scale(${s})`; st.style.left = (innerWidth-1920*s)/2+'px'; st.style.top = (innerHeight-1080*s)/2+'px'; }
addEventListener('resize', fit);
function beep(f=880){ try{ const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = f; g.gain.setValueAtTime(.06,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25); o.start(); o.stop(c.currentTime+.25);}catch(e){} }
const totals = () => MENU.reduce((s,c)=> sel[c.cat]!=null ? s.map((n,i)=>n+c.items[sel[c.cat]].v[i]) : s, [0,0,0,0,0,0,0]);
const whenTxt = () => when.type==='asap' ? 'As soon as possible · about 30 min' : when.type==='late' ? `Late delivery · ${fmt(when.t)}${when.reason?' · '+when.reason:''}` : `Scheduled · ${fmt(when.t)}`;

function topBar(){
  const now = new Date(), h = now.getHours();
  return `<div class="top"><span role="img" aria-label="Kuwait Hospital · مستشفى الكويت" class="logo-plate lp-md"></span><div class="logo kh-mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></div>
    <div class="brand"><b class="kh-mark">KUWAIT HOSPITAL</b><span>In-Room Dining · <span class="ar">قائمة الطعام</span></span></div>
    <div class="who"><span class="g">${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}</span><b>Demo Patient</b></div>
    <div class="room"><span class="pill">Room 312 · Bed A</span><span class="pill">Diabetic · Regular texture</span><span class="pill ok">✓ Diet approved</span></div>
    <div class="clock"><b id="clk">${fmt(now)}</b><span>Lunch · 12:00 – 2:00</span></div></div>`;
}
function rail(){
  const items = MENU.map((c,i)=>({lab:c.cat, sub: sel[c.cat]!=null ? c.items[sel[c.cat]].n : 'Choose one', done: sel[c.cat]!=null, i}))
    .concat([{lab:'Delivery time', sub: step>5 ? whenTxt() : 'When to serve', done: step>5, i:5}, {lab:'Review & send', sub:'Check your tray', done:false, i:6}]);
  return `<div class="rail"><h6>Your luncheon</h6>${items.map(r=>`<button class="ri nav ${r.done?'done':''} ${step===r.i?'cur':''}" data-k="rail${r.i}" onclick="go(${r.i})"><span class="n">${r.done?'✓':(ROMAN[r.i]||r.i+1)}</span><span>${r.lab}<small>${r.sub}</small></span></button>`).join('')}</div>`;
}
function tray(){
  const t = totals(), n = Object.keys(sel).length;
  return `<div class="tray"><div class="ey">Your tray · <span class="ar">صينيتك</span></div><h3>Luncheon</h3>
    ${MENU.map(c=>{ const f = sel[c.cat]!=null ? c.items[sel[c.cat]] : null; return f ? `<div class="tl"><span class="th">${pic(f)}</span><div><small>${c.cat}</small>${f.n}</div></div>` : `<div class="tl empty"><span class="th"></span><div><small>${c.cat}</small>Not chosen</div></div>`; }).join('')}
    <div class="tsum"><span>Energy</span><b>${t[0]} kcal</b></div><div class="tsum"><span>Carbohydrates</span><b>${t[1]} g</b></div>
    <div class="twhen">🕑 ${whenTxt()}</div>
    <button class="trayb nav ${n===5?'ready':''}" data-k="send" onclick="${n===5?'go(6)':''}">${n===5 ? 'Review & send →' : `Choose ${5-n} more`}</button></div>`;
}
const hints = () => `<div class="hints"><span><span class="k">◀</span><span class="k">▲</span><span class="k">▼</span><span class="k">▶</span>Move</span><span><span class="k ok">OK</span>Select</span><span><span class="k">↩</span>Back</span><span class="cut">Order within <b id="cut">45</b> min for lunch</span></div>`;

function render(){
  let body = '';
  if(step < STEPS){
    const c = MENU[step];
    body = rail() + `<div class="main fade"><div class="eyebrow">Course ${ROMAN[step]} of V · Choose one</div><h1>${c.cat}<span class="ar">${c.ar}</span></h1>
      <div class="sub">Dishes marked “Dietitian’s choice” are recommended for your diet.</div>
      <div class="cards">${c.items.map((f,i)=>{ const lk = !ok(c.cat,i);
        return `<button class="card nav ${sel[c.cat]===i?'sel':''} ${lk?'locked':''}" data-k="c${i}" onclick="pick(${i})">
          <div class="ph">${pic(f)}<span class="tag">${f.tag}</span>${PLAN.rec[c.cat]===i?'<span class="rib">✦ Dietitian’s choice</span>':''}<span class="tick">✓</span></div>
          <div class="tx"><b>${f.n}</b><span class="car ar">${f.ar}</span><p>${lk ? 'Not on your diet plan today · <span class="ar">غير مناسب لنظامك</span>' : f.d}</p><div class="meta">${f.v[0]} kcal · ${f.v[1]} g carbs · ${f.v[2]} g protein</div></div></button>`;}).join('')}</div></div>` + tray();
  } else if(step===5){
    const b = new Date(Date.now()+30*MIN); b.setSeconds(0,0); b.setMinutes(Math.ceil(b.getMinutes()/15)*15);
    const slots = Array.from({length:6},(_,i)=>b.getTime()+i*15*MIN);
    const lateOn = when.type==='late';
    body = rail() + `<div class="main fade"><div class="eyebrow">Course VI · Delivery time</div><h1>When shall we serve?<span class="ar">وقت التقديم</span></h1>
      <div class="tiles">
        <button class="tile wide nav ${when.type==='asap'?'on':''}" data-k="asap" onclick="setWhen({type:'asap'})"><span>⚡</span><div>As soon as possible<small>About 30 minutes</small></div></button>
        <button class="tile wide nav ${lateOn?'on':''}" data-k="late" onclick="setWhen({type:'late', t:Date.now()+120*60000, reason:when.reason||'Dialysis session'})"><span>🌙</span><div>Late delivery<small>I'm away, keep my tray for later</small></div></button>
        ${lateOn ? '' : slots.map((t,i)=>`<button class="tile nav ${when.type==='slot'&&when.t===t?'on':''}" data-k="s${i}" onclick="setWhen({type:'slot', t:${t}})">${fmt(t)}<small>in ${Math.round((t-Date.now())/MIN)} min</small></button>`).join('')}
      </div>
      ${lateOn ? `<div class="lbl">Late delivery time and reason</div><div class="tiles">
        ${[60,120,180].map(m=>`<button class="tile nav ${Math.abs(when.t-(Date.now()+m*MIN))<MIN?'on':''}" data-k="l${m}" onclick="setWhen({type:'late', t:Date.now()+${m}*60000, reason:when.reason})">In ${m/60} hour${m>60?'s':''}<small>${fmt(Date.now()+m*MIN)}</small></button>`).join('')}
        <button class="tile nav" data-k="lnext" onclick="go(6)">Continue →<small>Review my tray</small></button>
        ${['In a procedure / scan','Dialysis session','Fasting for a test','Resting'].map((r,i)=>`<button class="tile nav ${when.reason===r?'on':''}" data-k="r${i}" style="font-size:22px" onclick="setWhen(Object.assign({}, when, {reason:'${r}'}))">${r}</button>`).join('')}
      </div>` : `<div class="bigs"><button class="big gold nav" data-k="next" onclick="go(6)">Continue to review →</button></div>`}</div>` + tray();
  } else if(step===6){
    const t = totals();
    body = rail() + `<div class="main fade"><div class="eyebrow">Review & send</div><h1>Your luncheon tray<span class="ar">راجع طلبك</span></h1>
      <div class="rev">${MENU.map(c=>{ const f = c.items[sel[c.cat]]; return `<div class="rv"><div class="ph">${pic(f)}</div><div><small>${c.cat}</small><b>${f.n}</b></div></div>`; }).join('')}</div>
      <div class="facts"><div class="fact"><b>${t[0]}</b><span>KCAL</span></div><div class="fact"><b>${t[1]} g</b><span>CARBOHYDRATES</span></div><div class="fact"><b>${t[2]} g</b><span>PROTEIN</span></div><div class="fact" style="flex:2"><b style="font-size:24px">🕑 ${whenTxt()}</b><span>DELIVERY</span></div></div>
      <div class="bigs"><button class="big gold nav" data-k="sendnow" onclick="send()">✓ Send order to kitchen</button><button class="big soft nav" data-k="change" onclick="go(0)">Change dishes</button><button class="big soft nav" data-k="ctime" onclick="go(5)">Change time</button></div></div>` + tray();
  } else if(step===7){
    const lbl = ['Received','Preparing','Ready','On the way','Delivered'];
    const msg = ['The kitchen has your order','Your meal is being prepared','Your tray is ready','Your tray is on its way to you','Enjoy your meal — صحة وعافية'];
    body = `<div class="center fade" style="right:60px;left:60px"><svg class="chk" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><path d="M30 52l13 13 27-29"/></svg>
      <h1>Thank you — bon appétit</h1><div class="ar">تم إرسال طلبك إلى المطبخ</div><div class="ord">ORDER #1001 · ${whenTxt().toUpperCase()}</div>
      <div class="trk">${lbl.map((l,i)=>`<div class="st ${i<track||track===4?'done':i===track?'now':''}"><div class="dt">${i<track||track===4?'✓':''}</div>${l}</div>`).join('')}</div>
      <div class="msg">${msg[track]}</div>
      ${track===4 ? `<div class="bigs" style="justify-content:center"><button class="big gold nav" data-k="rate" onclick="go(8)">★ Rate your meal</button></div>` : ''}</div>`;
  } else if(step===8){
    const L = ['Tap OK on a star','Poor · ضعيف','Fair · مقبول','Good · جيد','Very good · جيد جداً','Excellent · ممتاز'];
    body = `<div class="center fade" style="right:60px;left:60px;top:220px"><div class="eyebrow">Order #1001 · Room 312-A</div><h1>How was your meal?</h1><div class="ar">كيف كانت وجبتك؟</div>
      <div class="stars">${[1,2,3,4,5].map(n=>`<button class="star nav ${n<=stars?'on':''}" data-k="st${n}" onfocus="hov(${n})" onclick="rate(${n})">★</button>`).join('')}</div>
      <div class="slbl" id="slbl">${L[stars]}</div></div>`;
  } else {
    body = `<div class="center fade" style="right:60px;left:60px;top:260px"><svg class="chk" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><path d="M30 52l13 13 27-29"/></svg>
      <h1>Thank you — shukran!</h1><div class="ar">شكراً لك، نسعد بخدمتك</div><div class="msg">${'★'.repeat(stars)} · your feedback goes straight to our chefs</div>
      <div class="bigs" style="justify-content:center"><button class="big soft nav" data-k="again" onclick="restart()">Back to menu</button></div></div>`;
  }
  $("stage").innerHTML = topBar() + body + hints();
  const q = x => $('stage').querySelector(x);
  const target = (focusKey && q(`[data-k="${focusKey}"]`)) || q('.card.sel:not(.locked)') || q('.card:not(.locked)') || q('.tile.on') || q('.big.gold') || q('.star') || q('.nav');
  if(target) target.focus({preventScroll:true});
}
function go(i){
  if(i===6 && Object.keys(sel).length<5){ toast('Please choose one dish from each course'); return; }
  step = i; focusKey = null; render(); beep(660);
}
function pick(i){
  const c = MENU[step];
  if(!ok(c.cat,i)){ toast('Not on your diet plan today'); beep(300); return; }
  sel[c.cat] = i; beep(1046); focusKey = 'c'+i; render();
  setTimeout(()=>{ const next = MENU.findIndex(x=>sel[x.cat]==null); step = next>-1 ? next : 5; focusKey = null; render(); }, 650);
}
function setWhen(w){ when = w; focusKey = document.activeElement && document.activeElement.dataset.k; render(); beep(990); }
function send(){ step = 7; track = 0; focusKey = null; render(); beep(); setTimeout(()=>beep(1175),160);
  const tick = ()=>{ if(step!==7 || track>=4) return; track++; focusKey = null; render(); beep(880); if(track<4) setTimeout(tick, 3500); };
  setTimeout(tick, 3500); }
const LBL = ['Tap OK on a star','Poor · ضعيف','Fair · مقبول','Good · جيد','Very good · جيد جداً','Excellent · ممتاز'];
function hov(n){ document.querySelectorAll('.star').forEach((s,i)=>s.classList.toggle('on', i<n)); const l = $('slbl'); if(l) l.textContent = LBL[n]; }
function rate(n){ stars = n; beep(600+n*120); step = 9; setTimeout(render, 350); }
function restart(){ step = 0; sel = {}; when = {type:'asap'}; stars = 0; render(); }
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; $('stage').appendChild(d); setTimeout(()=>d.remove(), 2200); }
// remote control: arrow keys move focus to the nearest item in that direction; Enter = OK; Backspace/Escape = back
function move(dir){
  const cur = document.activeElement, els = [...$('stage').querySelectorAll('.nav')];
  if(!cur || !els.includes(cur)){ els[0] && els[0].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let best = null, bd = Infinity;
  els.forEach(e=>{ if(e===cur) return; const q = e.getBoundingClientRect(), x = q.left + q.width/2, y = q.top + q.height/2, dx = x - cx, dy = y - cy;
    const okd = dir==='L' ? dx < -5 : dir==='R' ? dx > 5 : dir==='U' ? dy < -5 : dy > 5; if(!okd) return;
    const d = (dir==='L'||dir==='R') ? Math.abs(dx) + Math.abs(dy)*2.5 : Math.abs(dy) + Math.abs(dx)*2.5;
    if(d < bd){ bd = d; best = e; } });
  if(best){ best.focus({preventScroll:true}); beep(520); }
}
addEventListener('keydown', e=>{
  const m = {ArrowLeft:'L', ArrowRight:'R', ArrowUp:'U', ArrowDown:'D'}[e.key];
  if(m){ e.preventDefault(); move(m); }
  else if(e.key==='Backspace' || e.key==='Escape' || e.key==='BrowserBack'){ e.preventDefault(); if(step>0 && step<7) go(step-1); }
});
setInterval(()=>{ const c = $('clk'); if(c) c.textContent = fmt(Date.now()); }, 15000);
fit(); render();
</script>
</body>
</html>
